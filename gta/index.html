<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GTA Barcelona — Fase 0: la ciudad</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#f3f1ea; --dim:#b9c0c7; --panel:rgba(14,20,28,.72); --line:rgba(255,255,255,.14); --acc:#ffc247; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b1118; color:var(--ink);
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #title { top:12px; left:12px; padding:10px 14px; max-width:min(360px,60vw); }
  #title b { font-size:17px; letter-spacing:.06em; }
  #title span { color:var(--acc); }
  #title small { display:block; color:var(--dim); margin-top:2px; }
  #where { bottom:12px; left:12px; padding:8px 12px; min-width:230px; font-variant-numeric:tabular-nums; }
  #where .big { font-size:16px; font-weight:600; }
  #where .dim { color:var(--dim); font-size:12px; }
  #side { top:12px; right:12px; width:216px; max-height:calc(100% - 24px); overflow:auto; padding:8px; }
  #side h4 { margin:6px 4px 4px; font-size:11px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; font-weight:600; }
  #side button { display:block; width:100%; text-align:left; margin:3px 0; padding:7px 9px; border-radius:7px; cursor:pointer;
    background:rgba(255,255,255,.06); color:var(--ink); border:1px solid transparent; font:inherit; }
  #side button:hover { background:rgba(255,255,255,.14); }
  #side button.on { border-color:var(--acc); color:var(--acc); }
  #side .row { display:flex; gap:4px; } #side .row button { text-align:center; } #gqRow button, #hRow button { padding:7px 2px; }
  #side label { display:block; margin:6px 4px 2px; color:var(--dim); font-size:12px; }
  #side input[type=range] { width:100%; accent-color:var(--acc); }
  #help { bottom:12px; right:12px; padding:8px 12px; color:var(--dim); font-size:12px; max-width:216px; }
  #help b { color:var(--ink); font-weight:600; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .lb { position:absolute; left:0; top:0; white-space:nowrap; transform:translate(-50%,-50%); text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8);
    font-size:12px; color:#fff; will-change:transform; }
  .lb.d { font-size:15px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#ffe9b8; }
  .lb.p { font-size:12px; font-weight:600; color:var(--acc); }
  .lb.p::before { content:"◆ "; font-size:9px; }
  #load { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at 50% 40%,#1b2a3a,#0b1118 70%); z-index:10; transition:opacity .6s; text-align:center; padding:20px; }
  #load h1 { margin:0; font-size:34px; letter-spacing:.12em; } #load h1 span { color:var(--acc); }
  #bar { width:min(420px,80vw); height:6px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .25s; }
  #msg { color:var(--dim); min-height:1.4em; }
  #err { color:#ff9a8a; max-width:640px; white-space:pre-wrap; }
  #menuBtn { display:none; top:12px; right:12px; padding:8px 12px; cursor:pointer; z-index:3; }
  body.shot .panel, body.shot #labels { display:none !important; }
  @media (max-width:760px) {
    #side { display:none; top:52px; } body.menu #side { display:block; } #menuBtn { display:block; }
    #help { display:none; } #title small { display:none; }
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>
<div id="title" class="panel"><b>GTA <span>BARCELONA</span></b><small>Fase 0 · La ciudad, generada con datos reales</small></div>
<div id="where" class="panel"><div class="big" id="wBarri">—</div><div class="dim" id="wInfo"></div></div>
<div id="menuBtn" class="panel">☰ Vistas</div>
<div id="side" class="panel">
  <h4>Modo</h4>
  <div class="row"><button id="mDron" class="on">Dron</button><button id="mPie">A pie</button></div>
  <h4>Vistas</h4>
  <div id="views"></div>
  <h4>Ajustes</h4>
  <label>Hora del día: <span id="hourV"></span></label>
  <input id="hour" type="range" min="0" max="24" step="0.25" value="17">
  <div class="row" id="hRow"><button id="hDia">Día</button><button id="hTarde">Tarde</button><button id="hNoche">Noche</button><button id="hRun" title="Un día completo cada 24 minutos">▶ Pasa</button></div>
  <label>Distancia de edificios: <span id="distV"></span></label>
  <input id="dist" type="range" min="2" max="40" step="1" value="40">
  <label>Fachadas de detalle al acercarse</label>
  <div class="row" id="fxRow"><button id="fx0">No</button><button id="fx1" class="on">Normal</button><button id="fx2">Alta</button></div>
  <label>Calles de detalle (aceras, árboles, mobiliario)</label>
  <div class="row" id="stRow"><button id="st0">No</button><button id="st1" class="on">Normal</button><button id="st2">Alta</button></div>
  <label id="gqLab">Gráficos <span id="gqV"></span></label>
  <div class="row" id="gqRow"><button id="gq0" class="on">Auto</button><button id="gq1">Baja</button><button id="gq2">Media</button><button id="gq3">Alta</button></div>
  <button id="tLabels" class="on">Nombres de barrios</button>
  <h4>Datos</h4>
  <div id="stats" style="color:var(--dim);font-size:12px;margin:0 4px 6px"></div>
</div>
<div id="help" class="panel">
  <b>Ratón</b> arrastra para mirar · rueda para avanzar<br>
  <b>W A S D</b> moverte · <b>Q / E</b> bajar / subir<br>
  <b>Mayús</b> turbo · <b>mando</b> PS4/PS5 compatible
</div>
<div id="load">
  <h1>GTA <span>BARCELONA</span></h1>
  <div id="bar"><i></i></div>
  <div id="msg">Cargando la ciudad…</div>
  <div id="err"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.35.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<!-- orden obligatorio: utilidades → hooks (suelo, mobiliario, interiores, detalle) → núcleos (fachadas, calles) → luz → app -->
<script src="geo.js"></script>
<script src="ground.js"></script>
<script src="furniture.js"></script>
<script src="interiors.js"></script>
<script src="details.js"></script>
<script src="facades.js"></script>
<script src="streets.js"></script>
<script src="lighting.js"></script>
<script src="app.js"></script>
</body>
</html>
